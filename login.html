        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                    </a>

                <li class="nav-item">

                    <a class="nav-link"
                       href="signup.html">
                        Register
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- PAGE HEADER -->

<section class="page-header">

    <div class="container">

        <h1>
            Login
        </h1>

        <nav>

            <ol class="breadcrumb">

                <li class="breadcrumb-item">

                    <a href="index.html">
                        Home
                    </a>

                </li>

                <li class="breadcrumb-item active">

                    Login

                </li>

            </ol>

        </nav>

    </div>

</section>


<!-- LOGIN -->

<section class="section-padding">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="form-card">

                    <div class="section-heading">

                        <span>
                            WELCOME BACK
                        </span>

                        <h2>
                            Login
                        </h2>

                        <p>
                            Login to continue.
                        </p>

                    </div>


                    <form id="loginForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                required>

                        </div>


                        <div class="d-flex justify-content-between mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox">

                                <label class="form-check-label">
                                    Remember me
                                </label>

                            </div>

                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary-custom w-100">

                            <i class="bi bi-box-arrow-in-right"></i>
                            Login

                        </button>


                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="signup.html">
                                Register
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

        </p>
